# Release workflow для сборки и публикации релиза
# Запускается на push тега v* или вручную через workflow_dispatch

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Текст релиза (если пусто — будет использовано сообщение тега)'
        required: false
        type: string

jobs:
  # Job для сборки и проверки
  build:
    name: Build
    runs-on: ubuntu-latest
    # Настройки памяти Gradle Daemon задаются в gradle.properties
    # (org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m), который
    # теперь отслеживается git. GRADLE_OPTS не влияет на Daemon, поэтому не используется.
    outputs:
      version_name: ${{ steps.extract_version.outputs.version_name }}
      apk_path: ${{ steps.rename_apk.outputs.apk_path }}
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5

      - name: Настройка JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэширование Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Декодирование keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks

      - name: Установка прав на gradlew
        run: chmod +x gradlew

      - name: Сборка release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          -PKEY_ALIAS="$KEY_ALIAS"
          -PKEY_ALIAS_PASSWORD="$KEY_ALIAS_PASSWORD"

      - name: Извлечение versionName
        id: extract_version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Переименование APK
        id: rename_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          NEW_APK_NAME="FlowCapital_${{ steps.extract_version.outputs.version_name }}.apk"
          mv "$APK_PATH" "$NEW_APK_NAME"
          echo "apk_path=$NEW_APK_NAME" >> $GITHUB_OUTPUT

      - name: Загрузка APK как артефакта
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: ${{ steps.rename_apk.outputs.apk_path }}

  # Job для создания релиза
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Скачивание APK артефакта
        uses: actions/download-artifact@v5
        with:
          name: release-apk
          path: .

      - name: Получение release notes
        id: get_release_notes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "${{ github.event.inputs.release_notes }}" > release_notes.md
          else
            git cat-file tag "${{ github.ref_name }}" | sed -n '/^$/,$p' | sed '1d' > release_notes.md
          fi
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Создание GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: FlowCapital v${{ needs.build.outputs.version_name }}
          body: ${{ steps.get_release_notes.outputs.release_notes }}
          files: ${{ needs.build.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
