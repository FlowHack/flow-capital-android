# Release workflow для сборки и публикации релиза
# Запускается на push тега v* или вручную через workflow_dispatch

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Текст релиза (если пусто — будет использовано сообщение тега)'
        required: false
        type: string

jobs:
  # Job для сборки APK
  build:
    name: Build
    runs-on: ubuntu-latest
    # Настройки памяти Gradle Daemon задаются в gradle.properties
    # (org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m), который
    # теперь отслеживается git. GRADLE_OPTS не влияет на Daemon, поэтому не используется.
    outputs:
      version_name: ${{ steps.extract_version.outputs.version_name }}
      apk_path: ${{ steps.rename_apk.outputs.apk_path }}
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5

      - name: Настройка JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэширование Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Декодирование keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks

      - name: Установка прав на gradlew
        run: chmod +x gradlew

      - name: Сборка release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          -PKEY_ALIAS="$KEY_ALIAS"
          -PKEY_ALIAS_PASSWORD="$KEY_ALIAS_PASSWORD"

      - name: Извлечение versionName
        id: extract_version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Переименование APK
        id: rename_apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          NEW_APK_NAME="FlowCapital_${{ steps.extract_version.outputs.version_name }}.apk"
          mv "$APK_PATH" "$NEW_APK_NAME"
          echo "apk_path=$NEW_APK_NAME" >> $GITHUB_OUTPUT

      - name: Загрузка APK как артефакта
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: ${{ steps.rename_apk.outputs.apk_path }}

  # Job для создания релиза (с пустым текстом)
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачивание APK артефакта
        uses: actions/download-artifact@v5
        with:
          name: release-apk
          path: .

      - name: Создание GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: FlowCapital v${{ needs.build.outputs.version_name }}
          APK_PATH: ${{ needs.build.outputs.apk_path }}
        run: |
          # Формируем JSON с пустым телом релиза
          jq -n \
            --arg name "$RELEASE_NAME" \
            --arg tag "${{ github.ref_name }}" \
            '{name: $name, tag_name: $tag, body: "", draft: false, prerelease: false}' > release_payload.json

          # Создаём релиз
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d @release_payload.json \
            "https://api.github.com/repos/${{ github.repository }}/releases")

          # Извлекаем upload_url
          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')
          echo "Upload URL: $UPLOAD_URL"

          # Загружаем APK
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH" \
            "$UPLOAD_URL?name=$(basename "$APK_PATH")"

  # Job для обновления текста релиза
  update_release:
    name: Update Release Notes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Получение release notes из тега
        id: get_release_notes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "${{ github.event.inputs.release_notes }}" > release_notes.md
          else
            # Тег уже на remote (релиз создан в предыдущей job), загружаем его
            git fetch origin tag "${{ github.ref_name }}" --force
            # Извлекаем текст тега (после заголовка tagger)
            git show "${{ github.ref_name }}" | sed -n '/^$/,$p' | sed '1d' > release_notes.md
          fi

      - name: Обновление текста релиза
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Конвертируем LF в CRLF (GitHub рендерит Markdown с CRLF корректно)
          sed -i 's/$/\r/' release_notes.md

          # Формируем JSON с телом релиза (Markdown рендерится автоматически)
          jq -n \
            --arg tag "${{ github.ref_name }}" \
            --rawfile body release_notes.md \
            '{body: $body}' > update_payload.json

          # Получаем ID релиза по тегу
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | jq -r '.id')

          echo "Release ID: $RELEASE_ID"

          # Обновляем текст релиза
          curl -s -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d @update_payload.json \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
