# CI workflow для проверки качества кода
# Запускается на push в develop, master, main и PR в эти ветки
# Выполняет lint и unit-тесты параллельно

name: CI

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
    branches: [ develop, master, main ]

jobs:
  # Job для проверки линтера
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Настройки памяти Gradle Daemon задаются в gradle.properties
    # (org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m), который
    # теперь отслеживается git. GRADLE_OPTS не влияет на Daemon, поэтому не используется.
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэширование Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Установка прав на gradlew
        run: chmod +x gradlew

      - name: Запуск линтера
        run: ./gradlew :app:lint

  # Job для запуска unit-тестов
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэширование Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Установка прав на gradlew
        run: chmod +x gradlew

      - name: Запуск unit-тестов
        run: ./gradlew :app:testDebugUnitTest